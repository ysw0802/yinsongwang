<!--
  文件名称：mobile-zoom.html
  作    者：尹松旺
  建立时间：2026-11-16
  使用模型：GLM-5.3-Flash
  功能简介：移动端媒体查看器——支持图片 / 视频切换，双指缩放 1~4 倍、
           双击 1x/2x、放大后单指拖动、缩回 1x 自动居中；视频也可缩放查看
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>图片查看器 · 双指缩放（任务三）</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0 40px; }

    .ysw_tip {
      background: #1e293b; color: #93c5fd; padding: 8px 18px; border-radius: 999px;
      font-size: 12px; margin-bottom: 12px; letter-spacing: 1px;
    }
    .ysw_h1 { font-size: 18px; margin: 6px 0 4px; color: #f1f5f9; letter-spacing: 2px; }
    .ysw_hint { font-size: 12px; color: #94a3b8; margin-bottom: 18px; text-align: center; line-height: 1.8; }

    /* 图片容器：overflow:hidden 裁剪 + touch-action:none 接管手势 */
    .ysw_viewer {
      width: 100%;
      max-width: 420px;
      height: 420px;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: #020617;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      position: relative;
    }
    .ysw_viewer img, .ysw_viewer video {
      width: 100%; height: 100%;
      object-fit: cover;
      will-change: transform;
      transition: transform .25s ease-out;
      transform-origin: center center;
      display: block;
    }

    /* 媒体切换按钮 */
    .ysw_switch {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .ysw_switch button {
      padding: 8px 20px; border-radius: 999px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 12px; letter-spacing: 2px;
      cursor: pointer; transition: all .2s;
    }
    .ysw_switch button.ysw_active {
      background: #3b82f6; color: #fff; border-color: #3b82f6;
    }

    /* 缩放比例指示器 */
    .ysw_scale_badge {
      position: absolute; top: 14px; right: 14px;
      background: rgba(15, 23, 42, .7); color: #fbbf24;
      font-size: 12px; padding: 4px 10px; border-radius: 999px; letter-spacing: 1px;
      pointer-events: none;
    }

    .ysw_back { margin-top: 20px; }
    .ysw_back a { color: #93c5fd; text-decoration: none; font-size: 13px; font-weight: 700; }
    .ysw_back a:hover { color: #fff; }
    footer { margin-top: 28px; font-size: 11px; color: #475569; }
  </style>
</head>
<body>
  <div class="ysw_tip">📱 双指缩放请用手机打开 · 双击在 1x / 2x 之间切换</div>
  <div class="ysw_h1">媒体查看器</div>
  <div class="ysw_hint">图片 / 视频都可双指捏合缩放<br>放大后单指拖动查看细节 · 缩回 1x 自动居中</div>

  <!-- 媒体切换 -->
  <div class="ysw_switch">
    <button id="yswBtnImg" class="ysw_active">🖼️ 图片</button>
    <button id="yswBtnVid">🎬 视频</button>
  </div>

  <!-- 媒体容器 -->
  <div class="ysw_viewer" id="yswViewer">
    <img id="yswImg" src="swiper-imgs/c919_1.jpg" alt="C919 大飞机">
    <video id="yswVid" controls playsinline webkit-playsinline preload="metadata" style="display:none;">
      <source src="swiper-imgs/zoom-video.mp4" type="video/mp4">
      您的浏览器不支持 HTML5 视频
    </video>
    <div class="ysw_scale_badge" id="yswBadge">1.0x</div>
  </div>

  <div class="ysw_back"><a href="index.html">← 返回首页</a></div>
  <footer>高级网页设计 · 移动端触摸事件 · 任务三 · 2026-11-16</footer>

<script>
/* ysw_target：当前被缩放的媒体元素（img 或 video）
 * ysw_scale / ysw_totalScale：当前缩放倍数 / 最近一次 pinch 结束后的最终倍数
 * ysw_lastDist / ysw_startDist：上一帧两指距离 / 手势起始两指距离
 * ysw_dx / ysw_dy：媒体相对容器的位移
 * ysw_pinch / ysw_isMoving：是否处于双指 pinch / 单指拖动 中
 * ysw_lastTap：上次 touchend 时间戳（< 300ms 判定双击）
 */
var $img = document.getElementById('yswImg');
var $vid = document.getElementById('yswVid');
var $badge = document.getElementById('yswBadge');
var $btnImg = document.getElementById('yswBtnImg');
var $btnVid = document.getElementById('yswBtnVid');
var ysw_target = $img;   // 默认操作图片

var ysw_scale = 1, ysw_totalScale = 1;
var ysw_lastDist = 0, ysw_startDist = 0;
var ysw_startDX = 0, ysw_startDY = 0;
var ysw_dx = 0, ysw_dy = 0;
var ysw_pinch = false, ysw_isMoving = false;
var ysw_prevX = 0, ysw_prevY = 0;
var ysw_lastTap = 0;

/* 函数名：ysw_switchMedia
 * 功能：切换图片 / 视频，切换时重置所有缩放状态（避免残留 transform）
 */
function ysw_switchMedia(useVideo) {
  ysw_scale = 1; ysw_totalScale = 1;
  ysw_dx = 0; ysw_dy = 0;
  ysw_pinch = false; ysw_isMoving = false;
  ysw_lastDist = 0; ysw_lastTap = 0;

  if (useVideo) {
    $img.style.display = 'none';
    $vid.style.display = 'block';
    ysw_target = $vid;
    $btnVid.classList.add('ysw_active');
    $btnImg.classList.remove('ysw_active');
  } else {
    $vid.style.display = 'none';
    $img.style.display = 'block';
    ysw_target = $img;
    $btnImg.classList.add('ysw_active');
    $btnVid.classList.remove('ysw_active');
    // 切回图片时暂停视频
    $vid.pause && $vid.pause();
  }
  ysw_target.style.transition = 'none';
  ysw_applyTransform();
}
$btnImg.addEventListener('click', function () { ysw_switchMedia(false); });
$btnVid.addEventListener('click', function () { ysw_switchMedia(true); });

/* 函数名：ysw_dist
 * 功能：勾股定理算两指直线距离
 */
function ysw_dist(t1, t2) {
  return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
}

/* 函数名：ysw_applyTransform
 * 功能：把 scale / dx / dy 一次性写入 ysw_target 的 transform，同时更新徽章
 */
function ysw_applyTransform() {
  ysw_target.style.transform = 'translate(' + ysw_dx + 'px,' + ysw_dy + 'px) scale(' + ysw_scale + ')';
  $badge.textContent = ysw_scale.toFixed(2) + 'x';
}

/* 函数名：ysw_clamp
 * 功能：边界限位——1x 强制居中；放大后按 scale 计算可移动范围
 */
function ysw_clamp() {
  if (ysw_scale <= 1) { ysw_dx = 0; ysw_dy = 0; return; }
  var half = 420 * (ysw_scale - 1) / 2;
  if (ysw_dx >  half) ysw_dx =  half;
  if (ysw_dx < -half) ysw_dx = -half;
  if (ysw_dy >  half) ysw_dy =  half;
  if (ysw_dy < -half) ysw_dy = -half;
}

/* 函数名：ysw_centeredTransition
 * 功能：双击切换时 0.25s 平滑过渡到目标位置
 */
function ysw_centeredTransition() {
  ysw_dx = 0; ysw_dy = 0;
  ysw_target.style.transition = 'transform .25s ease-out';
  setTimeout(function () { ysw_target.style.transition = 'none'; }, 260);
}

ysw_target.style.transition = 'none';

/* touchstart：记录单指/双指状态，清掉上一轮残留 */
document.getElementById('yswViewer').addEventListener('touchstart', function (e) {
  ysw_lastDist = 0;
  if (e.touches.length >= 2) {
    ysw_pinch = true;
    var t1 = e.touches[0], t2 = e.touches[1];
    ysw_startDist = ysw_dist(t1, t2);
    ysw_lastDist = ysw_startDist;
    ysw_startDX = ysw_dx; ysw_startDY = ysw_dy;
  } else if (e.touches.length === 1 && ysw_scale > 1) {
    ysw_isMoving = true;
    ysw_prevX = e.touches[0].clientX;
    ysw_prevY = e.touches[0].clientY;
  }
}, { passive: false });

/* touchmove：双指算 scale，单指放大时算 dx/dy */
document.getElementById('yswViewer').addEventListener('touchmove', function (e) {
  e.preventDefault();

  if (ysw_pinch && e.touches.length >= 2) {
    var d = ysw_dist(e.touches[0], e.touches[1]);
    if (ysw_lastDist) {
      var ratio = d / ysw_lastDist;
      ysw_scale = ysw_totalScale * ratio * (ysw_lastDist / ysw_startDist);
      if (ysw_scale < 1) ysw_scale = 1;
      if (ysw_scale > 4) ysw_scale = 4;
      ysw_clamp();
      ysw_applyTransform();
    }
    ysw_lastDist = d;
  } else if (ysw_isMoving && e.touches.length === 1 && ysw_scale > 1) {
    var t = e.touches[0];
    ysw_dx += t.clientX - ysw_prevX;
    ysw_dy += t.clientY - ysw_prevY;
    ysw_prevX = t.clientX; ysw_prevY = t.clientY;
    ysw_clamp();
    ysw_applyTransform();
  }
}, { passive: false });

/* touchend：收尾。双指松手 → 保存最终 scale；单指松手 → 检测双击 */
document.getElementById('yswViewer').addEventListener('touchend', function (e) {
  if (ysw_pinch && e.touches.length < 2) {
    ysw_totalScale = ysw_scale;
    ysw_pinch = false;
    ysw_lastDist = 0;
    if (ysw_scale <= 1) { ysw_scale = 1; ysw_dx = 0; ysw_dy = 0; ysw_centeredTransition(); }
    ysw_applyTransform();
  }
  if (ysw_isMoving && e.touches.length === 0) {
    ysw_isMoving = false;
    ysw_clamp();
    ysw_applyTransform();

    var now = Date.now();
    if (now - ysw_lastTap < 300) {
      ysw_lastTap = 0;
      if (ysw_scale <= 1.05) {
        ysw_scale = 2; ysw_totalScale = 2;
      } else {
        ysw_scale = 1; ysw_totalScale = 1; ysw_dx = 0; ysw_dy = 0;
      }
      ysw_centeredTransition();
      ysw_applyTransform();
    } else {
      ysw_lastTap = now;
    }
  }
}, { passive: true });

/* touchcancel：系统打断（来电/手势返回），清理状态 */
document.getElementById('yswViewer').addEventListener('touchcancel', function () {
  ysw_pinch = false; ysw_isMoving = false; ysw_lastDist = 0;
});

ysw_applyTransform();
</script>
</body>
</html>
